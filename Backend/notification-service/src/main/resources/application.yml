spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:Bankingsystem}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    show-sql: true

    hibernate:
      ddl-auto: update

    database-platform: org.hibernate.dialect.MariaDBDialect

    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: notification-service-transfer-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

    listener:
      ack-mode: record

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}

    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 15000
      mail.smtp.timeout: 30000
      mail.smtp.writetimeout: 30000

server:
  port: 8906

banking:
  kafka:
    topics:
      transfer-completed: banking.transfer.completed.v1

  mail:
    from: ${MAIL_FROM:${SMTP_USERNAME}}
    enabled: ${MAIL_ENABLED:true}

  sms:
    enabled: ${SMS_ENABLED:false}
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    from-number: ${TWILIO_PHONE_NUMBER}
    default-country-code: ${SMS_DEFAULT_COUNTRY_CODE:+91}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true

    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/

  instance:
    prefer-ip-address: false
    hostname: localhost
    ip-address: 127.0.0.1
    non-secure-port-enabled: true
    secure-port-enabled: false
    non-secure-port: 8906
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    root: INFO
    com.bankingsystem.notificationservice.kafka: DEBUG
    org.springframework.kafka: INFO